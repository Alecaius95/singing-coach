<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1c2348"/>
      <stop offset="100%" stop-color="#06080f"/>
    </radialGradient>

    <!-- Grille (anisotropic: darker edges, bright centre) -->
    <radialGradient id="grilleGrad" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="45%" stop-color="#2d7ef6"/>
      <stop offset="100%" stop-color="#0f2a6a"/>
    </radialGradient>

    <!-- Handle -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0b1e58"/>
      <stop offset="28%"  stop-color="#2060d0"/>
      <stop offset="52%"  stop-color="#3a8ef8"/>
      <stop offset="76%"  stop-color="#1e52b8"/>
      <stop offset="100%" stop-color="#0a1840"/>
    </linearGradient>

    <!-- Band ring -->
    <linearGradient id="bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d2470"/>
      <stop offset="50%"  stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#0d2470"/>
    </linearGradient>

    <!-- Grille clip -->
    <clipPath id="gc">
      <rect x="202" y="58" width="108" height="162" rx="54"/>
    </clipPath>

    <!-- Handle clip -->
    <clipPath id="hc">
      <rect x="224" y="230" width="64" height="180" rx="14"/>
    </clipPath>

    <!-- Soft blur for glows -->
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="tinyBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="248" fill="none" stroke="#2d7ef6" stroke-width="1.5" opacity="0.25"/>

  <!-- Ambient glow behind mic -->
  <ellipse cx="256" cy="215" rx="75" ry="105" fill="#2d7ef6" opacity="0.18" filter="url(#softBlur)"/>

  <!-- ── GRILLE ── -->
  <!-- Main shape -->
  <rect x="202" y="58" width="108" height="162" rx="54" fill="url(#grilleGrad)"/>

  <!-- Mesh lines (clipped) -->
  <g clip-path="url(#gc)" opacity="0.35">
    <line x1="175" y1="95"  x2="337" y2="95"  stroke="white" stroke-width="1.8"/>
    <line x1="175" y1="112" x2="337" y2="112" stroke="white" stroke-width="1.8"/>
    <line x1="175" y1="129" x2="337" y2="129" stroke="white" stroke-width="1.8"/>
    <line x1="175" y1="146" x2="337" y2="146" stroke="white" stroke-width="1.8"/>
    <line x1="175" y1="163" x2="337" y2="163" stroke="white" stroke-width="1.8"/>
    <line x1="175" y1="180" x2="337" y2="180" stroke="white" stroke-width="1.8"/>
    <line x1="175" y1="197" x2="337" y2="197" stroke="white" stroke-width="1.8"/>
    <line x1="175" y1="214" x2="337" y2="214" stroke="white" stroke-width="1.8"/>
  </g>

  <!-- Specular highlight (left arc reflection) -->
  <ellipse cx="228" cy="128" rx="14" ry="36" fill="white" opacity="0.18" clip-path="url(#gc)"/>
  <!-- Tiny bright spot -->
  <ellipse cx="224" cy="100" rx="6" ry="8" fill="white" opacity="0.35" clip-path="url(#gc)"/>

  <!-- Rim shadow at bottom of grille -->
  <rect x="202" y="196" width="108" height="28" rx="0" fill="#060c28" opacity="0.4" clip-path="url(#gc)"/>

  <!-- ── NECK ── -->
  <rect x="238" y="215" width="36" height="22" rx="4" fill="#0e2268"/>
  <!-- Neck highlight -->
  <rect x="242" y="216" width="10" height="20" rx="3" fill="#3a6fc8" opacity="0.5"/>

  <!-- ── TOP BAND ── -->
  <rect x="224" y="234" width="64" height="9" rx="4" fill="url(#bandGrad)"/>

  <!-- ── HANDLE ── -->
  <rect x="224" y="240" width="64" height="180" rx="14" fill="url(#handleGrad)"/>

  <!-- Handle inner highlight -->
  <rect x="228" y="245" width="16" height="160" rx="8" fill="white" opacity="0.09" clip-path="url(#hc)"/>

  <!-- Mid band -->
  <rect x="224" y="330" width="64" height="9" rx="4" fill="url(#bandGrad)"/>

  <!-- Bottom band / cap -->
  <rect x="226" y="408" width="60" height="18" rx="8" fill="#0a1848"/>
  <rect x="226" y="408" width="60" height="6"  rx="3" fill="url(#bandGrad)" opacity="0.8"/>

  <!-- ── STAND ── -->
  <!-- Arc -->
  <path d="M256 428 Q256 468 256 474" stroke="#60a5fa" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- Base line -->
  <line x1="208" y1="474" x2="304" y2="474" stroke="#60a5fa" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <!-- Base glow -->
  <line x1="208" y1="474" x2="304" y2="474" stroke="#60a5fa" stroke-width="9" stroke-linecap="round" opacity="0.12" filter="url(#tinyBlur)"/>

  <!-- ── MUSICAL NOTES ── -->
  <text x="333" y="148" font-size="36" fill="#60a5fa" opacity="0.65" font-family="Georgia, serif">♪</text>
  <text x="156" y="198" font-size="24" fill="#2d7ef6" opacity="0.50" font-family="Georgia, serif">♫</text>
  <!-- Tiny floating dot accents -->
  <circle cx="348" cy="188" r="3" fill="#60a5fa" opacity="0.4"/>
  <circle cx="162" cy="152" r="2" fill="#2d7ef6" opacity="0.35"/>
</svg>
